<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!--
      Resolve the theme before the first paint.

      This runs synchronously in <head>, ahead of any markup, so the dark
      background is already on <html> when the body first renders. Doing it in
      a component instead — even in the root layout — is one frame too late,
      and that frame is a full-page white flash on every single load.

      Deliberately duplicated from src/lib/theme.svelte.ts rather than imported:
      an import would be a module, a module is deferred, and deferred is the
      one thing this cannot be. The storage key and the resolution rule must
      match that file exactly.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("oc:theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* Storage blocked. Light is the safe default; the app still works. */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
